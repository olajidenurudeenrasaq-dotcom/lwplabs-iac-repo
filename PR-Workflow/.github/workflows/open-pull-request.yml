name: Open pull request to main

on:
  workflow_run:
    workflows:
      - Validate Terraform
    types:
      - completed
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request when one does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          existing_pr=$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Deploy website changes from $BRANCH_NAME" \
              --body "Automated pull request. Terraform formatting and validation passed in GitHub Actions."
          else
            echo "Pull request #$existing_pr is already open for $BRANCH_NAME."
          fi
