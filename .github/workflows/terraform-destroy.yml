name: Destroy Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type destroy to confirm removal of all managed infrastructure"
        required: true
        type: string
        default: "no"

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Require destroy confirmation
        if: ${{ inputs.confirm_destroy != 'destroy' }}
        run: |
          echo "Confirmation failed. Set confirm_destroy to exactly 'destroy' to continue."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Read AWS region from terraform.tfvars
        shell: bash
        run: |
          REGION=$(grep -E '^aws_region[[:space:]]*=' terraform.tfvars | head -n 1 | cut -d '=' -f2 | tr -d '"' | xargs)
          if [ -z "$REGION" ]; then
            echo "aws_region was not found in terraform.tfvars"
            exit 1
          fi
          echo "AWS_REGION=$REGION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Plan and apply destroy with one dependency retry
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Terraform destroy attempt ${attempt}/2"

            if ! terraform plan -destroy -var-file="terraform.tfvars" -out=tfplan; then
              echo "Terraform destroy planning failed."
              exit 1
            fi

            if terraform apply -auto-approve -parallelism=1 tfplan; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "Terraform destroy failed on both attempts. Review remaining AWS dependencies before retrying."
              exit 1
            fi

            echo "Destroy encountered an AWS dependency error. Waiting 30 seconds, then replanning remaining resources."
            sleep 30
          done
