name: Terraform PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.1

      - name: Read AWS region from terraform.tfvars
        shell: bash
        run: |
          REGION=$(grep -E '^aws_region[[:space:]]*=' terraform.tfvars | head -n 1 | cut -d '=' -f2 | tr -d '"' | xargs)
          if [ -z "$REGION" ]; then
            echo "aws_region was not found in terraform.tfvars"
            exit 1
          fi
          echo "AWS_REGION=$REGION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -no-color -out=tfplan

      - name: Show Terraform plan summary
        run: terraform show -no-color tfplan
